# Builds Catlify for macOS and Windows and publishes a GitHub release.
#
# Release: merge a pull request from a `release/...` branch into main. The version comes from
# src-tauri/tauri.conf.json (bump it in the release branch); the merge commit is tagged `v<version>`.
# Test build: Actions → Release → Run workflow. Builds the installers as workflow artifacts, no release.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          release=${{ github.event_name == 'pull_request' }}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [ "$release" != true ]; then echo "Test build of $version"; exit 0; fi
          # release/1.2.3 must match the app version (other branch names just use the app version).
          named=${BRANCH#release/}; named=${named#v}
          if [[ "$named" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] && [ "$named" != "$version" ]; then
            echo "::error::Branch $BRANCH doesn't match the app version $version (src-tauri/tauri.conf.json)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump \"version\" in src-tauri/tauri.conf.json"; exit 1
          fi
      - name: Draft release
        if: steps.version.outputs.release == 'true'
        run: |
          cat > notes.md <<'EOF'
          ### Install
          - **macOS (Apple silicon)**: open the `.dmg` and drag Catlify to Applications. This build isn't notarized:
            the first time, right-click Catlify → Open, or run `xattr -dr com.apple.quarantine /Applications/Catlify.app`.
          - **Windows**: run the `-setup.exe` (or the `.msi`). For YouTube downloads install yt-dlp:
            `winget install yt-dlp.yt-dlp` (and `winget install Gyan.FFmpeg` for MP3).
          EOF
          gh release create "${{ steps.version.outputs.tag }}" --draft --target "$SHA" \
            --title "Catlify ${{ steps.version.outputs.version }}" --notes-file notes.md --generate-notes

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS: the same minimal static FFmpeg and bundled yt-dlp as local builds.
      - name: Cache FFmpeg (macOS)
        if: runner.os == 'macOS'
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/macos
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh macos-arm64
      - name: Stage ytdlp-apple (macOS)
        if: runner.os == 'macOS'
        run: scripts/ytdlp-apple.sh

      # Windows: LGPL FFmpeg 9 DLLs, shipped next to Catlify.exe.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_WINDOWS -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP
          $dir = (Get-ChildItem "$env:RUNNER_TEMP" -Directory -Filter 'ffmpeg-*' | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File $env:GITHUB_ENV -Append
          # ffmpeg-sys-next's build script (bindgen) overflows Windows' default 1 MB main-thread stack.
          "RUSTFLAGS=-C link-arg=/STACK:16777216" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force src-tauri/ffmpeg | Out-Null
          $resources = [ordered]@{}
          foreach ($dll in Get-ChildItem "$dir/bin/*.dll") {
            Copy-Item $dll.FullName src-tauri/ffmpeg/
            $resources["ffmpeg/$($dll.Name)"] = $dll.Name
          }
          @{ bundle = @{ resources = $resources } } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.windows.conf.json
          Get-Content src-tauri/tauri.windows.conf.json

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        env:
          # Signs the in-app update packages (repo secrets; see README → Releasing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          args=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          elif [ "$RELEASE" = true ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY isn't set: installed apps couldn't update to this release"; exit 1
          else
            echo "::warning::No updater signing key: building without update packages"
          fi
          if [ "$RUNNER_OS" = macOS ]; then args+=(--bundles app,dmg); fi
          pnpm tauri build "${args[@]}"

      - name: Collect installers
        id: files
        shell: bash
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p out
          b=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$b"/dmg/*.dmg "out/Catlify_${v}_macos-arm64.dmg"
            ditto -c -k --keepParent "$b/macos/Catlify.app" "out/Catlify_${v}_macos-arm64.app.zip"
            # In-app update package + signature
            if [ -f "$b/macos/Catlify.app.tar.gz" ]; then
              cp "$b/macos/Catlify.app.tar.gz" "out/Catlify_${v}_macos-arm64.app.tar.gz"
              cp "$b/macos/Catlify.app.tar.gz.sig" "out/Catlify_${v}_macos-arm64.app.tar.gz.sig"
            fi
          else
            cp "$b"/nsis/*-setup.exe "out/Catlify_${v}_windows-x64-setup.exe"
            cp "$b"/msi/*.msi "out/Catlify_${v}_windows-x64.msi"
            # The NSIS installer is the in-app update package on Windows
            for sig in "$b"/nsis/*-setup.exe.sig; do [ -f "$sig" ] && cp "$sig" "out/Catlify_${v}_windows-x64-setup.exe.sig"; done
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: catlify-${{ needs.prepare.outputs.version }}-${{ matrix.name }}
          path: out/*

      - name: Upload to release
        if: needs.prepare.outputs.release == 'true'
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/* --clobber

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      # latest.json: what installed apps check (tauri.conf.json → plugins.updater.endpoints).
      - name: Update manifest
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sig' -D sigs
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mac="Catlify_${VERSION}_macos-arm64.app.tar.gz"
          win="Catlify_${VERSION}_windows-x64-setup.exe"
          notes=$(printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY" | sed -e 's/\r$//')
          jq -n --arg v "$VERSION" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macSig "$(cat "sigs/$mac.sig")" --arg macUrl "$base/$mac" \
            --arg winSig "$(cat "sigs/$win.sig")" --arg winUrl "$base/$win" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
                "darwin-aarch64": {signature: $macSig, url: $macUrl},
                "windows-x86_64": {signature: $winSig, url: $winUrl}}}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json -R "$GITHUB_REPOSITORY" --clobber
      # Publishing creates the v<version> tag on the merge commit.
      - run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
