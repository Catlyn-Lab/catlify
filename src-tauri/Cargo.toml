[package]
name = "stafy"
version = "0.1.0"
description = "Stafy — a lightweight lossless music player"
edition = "2021"

[lib]
name = "stafy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["format", "codec", "software-resampling"] }
cpal = "0.18"
rtrb = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rusqlite = { version = "0.41", features = ["bundled"] }
lofty = "0.25"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
rand = "0.8"
log = "0.4"
tiny_http = "0.12"
mdns-sd = "0.21.7"
hmac = "0.13.0"
sha2 = "0.11.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
souvlaki = "0.9"
# In-app updates from GitHub releases (desktop).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Notch player window (src/notch.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSEvent", "NSWindow", "NSResponder", "NSGraphics"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Link a minimal static FFmpeg (scripts/build-ffmpeg.sh) so bundles are self-contained.
# FFMPEG_DIR selects the platform build (see .cargo/config.toml and scripts/).
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
ffmpeg-sys-next = { version = "9", default-features = false, features = ["static"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
